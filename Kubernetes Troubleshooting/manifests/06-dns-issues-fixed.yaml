apiVersion: v1
kind: Service
metadata:
  name: valid-db-service
spec:
  selector:
    app: db
  ports:
  - port: 5432
---
apiVersion: v1
kind: Pod
metadata:
  name: dns-test-fixed
spec:
  containers:
  - name: client
    image: busybox:1.36
    command: ["sh", "-c", "nslookup valid-db-service.default.svc.cluster.local && sleep 3600"]
