apiVersion: v1
kind: Pod
metadata:
  name: app-pod-net
  labels:
    app: custom-net-app
spec:
  containers:
  - name: web
    image: nginx:alpine
    ports:
    - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: custom-net-service-broken
spec:
  selector:
    app: custom-net-app
  ports:
  - port: 80
    targetPort: 9090
