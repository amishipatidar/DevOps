apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config-map
data:
  DATABASE_URL: "postgres://db.internal:5432/production"
---
apiVersion: v1
kind: Pod
metadata:
  name: config-pod-broken
spec:
  containers:
  - name: app
    image: alpine:latest
    command: ["sh", "-c", "echo $DB_URL && [ -n \"$DB_URL\" ] || (echo 'Missing DB_URL config key' && exit 1)"]
    env:
    - name: DB_URL
      valueFrom:
        configMapKeyRef:
          name: app-config-map
          key: WRONG_KEY_NAME
