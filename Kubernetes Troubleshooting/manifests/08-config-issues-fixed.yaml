apiVersion: v1
kind: Pod
metadata:
  name: config-pod-fixed
spec:
  containers:
  - name: app
    image: alpine:latest
    command: ["sh", "-c", "echo \"DB URL configured: $DB_URL\" && sleep 3600"]
    env:
    - name: DB_URL
      valueFrom:
        configMapKeyRef:
          name: app-config-map
          key: DATABASE_URL
