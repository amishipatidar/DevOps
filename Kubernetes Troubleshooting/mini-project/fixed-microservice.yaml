# Mini Project: 2-Tier Order Processing System (Fixed & Operational)
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-db-config
data:
  DB_HOST: "order-db-service"
  DB_PORT: "5432"
---
apiVersion: v1
kind: Pod
metadata:
  name: order-backend-fixed
  labels:
    app: order-backend
spec:
  containers:
  - name: backend
    image: alpine:latest
    command: ["sh", "-c", "echo \"Order backend connected to $DB_HOST:$PORT\" && sleep 3600"]
    env:
    - name: DB_HOST
      valueFrom:
        configMapKeyRef:
          name: order-db-config
          key: DB_HOST
    - name: PORT
      valueFrom:
        configMapKeyRef:
          name: order-db-config
          key: DB_PORT
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-frontend-fixed
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-frontend
  template:
    metadata:
      labels:
        app: order-frontend
    spec:
      containers:
      - name: frontend
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: order-frontend-service-fixed
spec:
  type: NodePort
  selector:
    app: order-frontend
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
