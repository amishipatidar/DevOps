# Mini Project: 2-Tier Order Processing System (Broken Deployment)
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-db-config
data:
  DB_HOST: "order-db-service"
  DB_PORT: "5432"
---
apiVersion: v1
kind: Pod
metadata:
  name: order-backend-broken
  labels:
    app: order-backend
spec:
  containers:
  - name: backend
    image: alpine:latest
    command: ["sh", "-c", "[ -n \"$PORT\" ] || (echo 'Error: POSTGRES_PORT environment variable missing!' && exit 1)"]
    env:
    - name: PORT
      valueFrom:
        configMapKeyRef:
          name: order-db-config
          key: POSTGRES_PORT # Bug 1: Key does not exist in ConfigMap
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-frontend-broken
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-frontend
  template:
    metadata:
      labels:
        app: order-frontend
    spec:
      containers:
      - name: frontend
        image: nginx:v999.0-invalid # Bug 2: Non-existent image tag
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: order-frontend-service-broken
spec:
  type: NodePort
  selector:
    app: order-frontend
  ports:
  - port: 80
    targetPort: 8080 # Bug 3: TargetPort mismatch (container listens on 80)
    nodePort: 30080
